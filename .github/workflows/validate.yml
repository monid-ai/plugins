name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON manifests parse
        run: |
          for f in $(git ls-files '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Check version and manifest consistency
        run: node scripts/check-versions.mjs

      # Asserts, not warns. A plugin that resolves as "1 skill" with no "mcp"
      # still installs cleanly on all seven agents — it just silently omits the
      # MCP server, which is most of the value. That failure is invisible
      # without this check.
      - name: Verify the plugin resolves with BOTH a skill and the MCP server
        run: |
          out=$(npx --yes plugins discover . 2>&1) || {
            echo "::error::plugins discover failed"; echo "$out"; exit 1;
          }
          echo "$out"
          echo "$out" | grep -q "skill" || {
            echo "::error::no skill detected — check skills/<name>/SKILL.md"; exit 1;
          }
          echo "$out" | grep -q "mcp" || {
            echo "::error::MCP server NOT detected. The plugins CLI reads .mcp.json (dot-prefixed); Agent Plugins/Cursor read mcp.json. Both must exist and match."; exit 1;
          }
